name: gut_md
description: A comprehensive health tracking application for individuals with digestive conditions including Crohn's, UC, IBS, and IBD.

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.5
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  image_picker: ^1.2.3
  mixpanel_flutter: ^2.1.1
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  share_plus: ^13.3.0
  http: ^1.1.0
  firebase_ai: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

